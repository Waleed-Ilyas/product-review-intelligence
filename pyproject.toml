[project]
name = "reviewintel"
version = "0.1.0"
description = "Product review intelligence: sentiment, themes, complaint trends"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
    "bertopic>=0.16",
    "shap>=0.45",
    "mlflow>=2.12",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewintel"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
